; Example Lex router preset library (--models-preset)
; Models are referenced by Hugging Face GGUF repos used in CI/smoke tests.
; Override ctx/batch/ngl for your hardware before production use.

[*]
mmap = 1
jinja = 1
batch-size = 512
ubatch-size = 256

[tinygemma3]
hf = ggml-org/tinygemma3-GGUF:Q8_0
ctx-size = 2048
n-gpu-layers = 0
temp = 0.7
top-p = 0.9
top-k = 40

[stories260k]
hf = ggml-org/test-model-stories260K:F32
ctx-size = 1024
n-gpu-layers = 0
temp = 0.8
top-k = 40

[stories260k-infill]
hf = ggml-org/test-model-stories260K-infill:F32
ctx-size = 1024
n-gpu-layers = 0
