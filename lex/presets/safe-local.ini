; Lex safe-local reference preset
; -----------------------------
; Per-model sampling / runtime knobs commonly used with llama-server / llama-cli.
; Process-level security flags (host bind, API key, MCP/tools) must still be
; passed on the CLI or environment — see lex/presets/README.md.

[*]
mmap = 1
jinja = 1

; Conservative default sampling for general chat
temp = 0.7
top-p = 0.9
top-k = 40
min-p = 0.05
repeat-penalty = 1.1

; Context / batch — override per hardware
ctx-size = 8192
batch-size = 512
ubatch-size = 512

; CPU-first defaults; set n-gpu-layers on GPU hosts
n-gpu-layers = 0
