name: Lex CI

# Minimal always-green CI for the Lex fork default branch.
# Upstream multi-backend workflows remain available but often target `master`.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: lex-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  LLAMA_LOG_COLORS: 1
  LLAMA_LOG_PREFIX: 1
  LLAMA_LOG_TIMESTAMPS: 1

jobs:
  cpu-build-test:
    name: cpu-build-test
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            cmake \
            ccache \
            git \
            libssl-dev \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: lex-ci-cpu
          evict-old-files: 1d

      - name: Configure
        run: |
          cmake --preset lex-cpu

      - name: Build
        run: |
          cmake --build --preset lex-cpu -j "$(nproc)"

      - name: Unit tests
        run: |
          ctest --test-dir build-lex-cpu -L main --output-on-failure --timeout 900

  server-tests:
    name: server-tests
    runs-on: ubuntu-latest
    steps:
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            build-essential \
            cmake \
            curl \
            git \
            libssl-dev \
            ninja-build \
            pkg-config \
            wget \
            xxd \
            language-pack-en

      - name: Clone
        uses: actions/checkout@v6

      - name: ccache
        uses: ggml-org/ccache-action@v1.2.21
        with:
          key: lex-ci-server
          evict-old-files: 1d

      - name: Configure & build server
        run: |
          cmake --preset lex-cpu
          cmake --build --preset lex-cpu -j "$(nproc)" --target llama-server

      - name: Python setup
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          pip-install: -r tools/server/tests/requirements.txt

      - name: Server integration tests
        run: |
          cd tools/server/tests
          pytest -v -x -m "not slow"
